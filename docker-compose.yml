services:

  api:
    build: .
    container_name: ai-incident-api

    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: sqlite:////app/data/incidents.db

    volumes:
      - incident_data:/app/data

    restart: unless-stopped


  dashboard:
    build: .
    container_name: ai-incident-dashboard

    command:
      [
        "streamlit",
        "run",
        "frontend/dashboard.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
        "--server.headless=true"
      ]

    ports:
      - "8501:8501"

    env_file:
      - .env

    environment:
      API_URL: http://api:8000

    depends_on:
      - api

    restart: unless-stopped


volumes:
  incident_data:
