services:

  api:
    build: .
    container_name: ai-incident-api

    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

    # Bound to localhost only: the API must not be reachable from other
    # machines on the same network (e.g. shared Wi-Fi).
    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: sqlite:////app/data/incidents.db

    volumes:
      - incident_data:/app/data

    restart: unless-stopped


  dashboard:
    build: .
    container_name: ai-incident-dashboard

    command:
      [
        "streamlit",
        "run",
        "frontend/dashboard.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
        "--server.headless=true"
      ]

    # The dashboard has no login of its own, so it is only exposed on
    # localhost. Put an authenticating reverse proxy in front before
    # exposing it anywhere else.
    ports:
      - "127.0.0.1:8501:8501"

    # Least privilege: the dashboard only receives the values it needs
    # (read from .env by Compose), not the OpenAI key or Slack webhook.
    environment:
      API_URL: http://api:8000
      APP_API_KEY: ${APP_API_KEY}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}

    depends_on:
      - api

    restart: unless-stopped


volumes:
  incident_data:
